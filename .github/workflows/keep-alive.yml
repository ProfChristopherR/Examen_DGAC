name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta a las 00:00 UTC cada 3 días
    - cron: '0 0 */3 * *'
  # Permite ejecutar el flujo manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X GET "https://${{ secrets.SUPABASE_REF }}.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
